<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
  <style>
    .container{
        margin-left:auto;
        margin-right:auto;
        text-align:justify;
    }
    .img{
        display:block;
        width:100%;
        height: auto;
    }

    @media (max-width: 768px) {
      img {
        width: 100%;
      }
    }

  </style>


<body>
    <div class="container mt-5">
      <h4>Bienvenido</h4>
      <img src="https://static.vecteezy.com/system/resources/previews/015/928/710/large_2x/group-of-smiling-teenage-girls-and-boys-with-backpacks-and-books-happy-students-in-casual-clothes-flat-cartoon-illustration-free-vector.jpg">
      <br><br><br>
        <!-- FLASH MESSAGES -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}



        <form method="POST" action="{{ url_for('login') }}">
        <!--<form id="myform" method="POST" action="choice">-->
          <label for="asig" class="form-label">Selecciona una asignatura</label><br>
          <select name="asig" required>
            <option value="PENSAMIENTO MATEMÁTICO 1">PENSAMIENTO MATEMÁTICO 1</option>
            <option value="PENSAMIENTO MATEMÁTICO 2">PENSAMIENTO MATEMÁTICO 2</option>
            <option value="SPA M1-S1">SPA M1-S1</option>
            <option value="SPA M1-S1">SPA M1-S2</option>
            <option value="SPA M1-S2">SPA M1-S3</option>
            <option value="SPA M2-S1">SPA M2-S1</option>
            <option value="SPA M2-S2">SPA M2-S2</option>
            <option value="SPA M2-S3">SPA M2-S3</option>
            <option value="TAG M1-S1">TAG M1-S1</option>
          </select>
          <br><br>
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
          
          
            <button type="submit" class="btn btn-primary">Login</button>
            <br>
            <br>

            <a>¿No tienes una cuenta?</a>
            <br>

            <form id="myform" method="POST" action="choice">
              <label>
                 ¿Quieres registrarte?<br>
                <input type="checkbox" name="choice" value="D" class="single-checkbox"> Si
              </label>
              <br>

              <a href="#" id="register-link">Continuar &#128209;</a>
              <!--<a type="button" href="{{ url_for('register') }}">Haz click para registrarte:</a>-->
            </form>
                <br><br>
        </form>

      <hr>


          <div class="row justify-content-center">
            <div class="col-12 col-md-6">
              <div class="iframe-wrapper" style="position: relative; padding-top: 56.25%; /* 16:9 ratio */">
          <iframe
            src="https://thingspeak.com/channels/2860984/charts/1?bgcolor=%23fada1a&color=%23d62020&dynamic=true&results=300&round=1&timescale=30&title=Temperatura+%C2%B0C&type=line&xaxis=time&yaxis=Temperatura"
            style="position: absolute; top:0; left:0; width:100%; height:100%; border:0;"
          ></iframe>
        </div>
      </div>
      </div>

    </div>

  



  <script>
    document.getElementById("register-link").addEventListener("click", function (e) {
      e.preventDefault();
      const checked = document.querySelector('input[name="choice"]:checked');
      if (checked) {
        const choice = checked.value;
        window.location.href = `/register?choice=${choice}`;
      } else {
        alert("Por favor, selecciona una opción antes de continuar.");
      }
    });
  </script>
</body>
</html>
