<!DOCTYPE html>
<html lang="en">
<head>
</head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<body>
  <main class="container">
  <h3>Enviar actividad:</h3>

    <form method="POST" enctype="multipart/form-data" action="{{ url_for('enviaractividad') }}">

        

        <label>Número de actividad:</label><br>
        <input type="number" name="actividad_num" placeholder="" required><br><br>

        <label>Número de control:</label><br>
        <input type="text" name="numero_control" placeholder="" required><br>

        <div class="mb-3">
            <label for="carrera" class="form-label">Carrera</label>
            <select name="carrera" required>
                <option value="SPA">SPA</option>
                <option value="SPP">SPP</option>
                <option value="SPP">CIS</option>
              </select>
        </div>

        
        <label>Archivo PDF:</label><br>
        <input type="file" name="pdf_file" accept="application/pdf" required><br><br>

        <button type="submit">Enviar</button>

        <a href="{{ url_for('hello_pm1') }}" class="btn btn-secondary">
            Cancelar
        </a>


    </form>
  </main>
</body>
</html>
